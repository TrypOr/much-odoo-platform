apiVersion: v1
kind: Secret
metadata:
  name: s3-config
stringData:
  s3.json: |
    {"identities":[{"name":"backup","credentials":[{"accessKey":"{{ .Values.accessKey }}","secretKey":"{{ .Values.secretKey
}}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: s3 }
  template:
    metadata:
      labels: { app: s3 }
      annotations:
        checksum/config: {{ .Values.accessKey | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          image: {{ .Values.image }}
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/config/s3.json
            - -master.volumeSizeLimitMB=256
            - -volume.max=20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: s3-data }
        - name: config
          secret: { secretName: s3-config }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: { app: s3 }
  ports:
    - { name: s3, port: 8333, targetPort: s3 }