apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Namespace }}-db
spec:
  instances: {{ .Values.db.instances }}
  imageName: {{ .Values.db.image }}
  storage:
    size: {{ .Values.db.storage }}
  resources:
    {{- toYaml .Values.db.resources | nindent 4 }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Release.Namespace }}-backups
  bootstrap:
    initdb:
      database: odoo
      owner: odoo
      secret:
        name: odoo-db