apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ include "tenant.dbCluster" . }}-pooler
spec:
  cluster:
    name: {{ include "tenant.dbCluster" . }}
  instances: 1
  type: rw
  pgbouncer:
    poolMode: session
  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  annotations:
    much.io/db-cluster: {{ include "tenant.dbCluster" . }}
spec:
  selector:
    cnpg.io/poolerName: {{ include "tenant.dbCluster" . }}-pooler
  ports:
    - { name: pgbouncer, port: 5432, targetPort: 5432 }
