db:
  image: ghcr.io/cloudnative-pg/postgresql:17.10-system-trixie
  instances: 1
  smartShutdownTimeout: 15
  storage: 2Gi
  cluster: primary
  restoreTargetTime: null
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

odoo:
  image: odoo:18.0-20261102
  hostname: odoo.localtest.me
  workers: 2
  filestoreSize: 1Gi
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1536Mi }
backup:
  endpoint: http://s3.objectstore:8333
  bucket: backups
  schedule: "0 0 * * * *"
  retention: 7d
filestoreBackup:
  image: rclone/rclone:1.71.2
  schedule: "*/15 * * * *"
