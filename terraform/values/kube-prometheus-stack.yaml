# k3s doesn't expose these components as scrape targets; disabling avoids permanent false alerts.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeProxy: false
    windows: false
  disabled:
    # WSL2 jitters process_start_time_seconds for every process, so this rule fires with zero restarts.
    # Crash loops are still caught by KubePodCrashLooping (restart counts from kube-state-metrics).
    AlertmanagerClusterCrashlooping: true

prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 30s
    evaluationInterval: 30s
    # pick up PodMonitors/Probes/Rules from every namespace, not only this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  config:
    route:
      receiver: oncall
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: deadman
          matchers: ['alertname = "Watchdog"']
          group_interval: 1m
          repeat_interval: 1m
        - receiver: "null"
          matchers: ['alertname = "InfoInhibitor"']
    receivers:
      - name: oncall
        webhook_configs:
          - url: http://alert-sink.monitoring:8080/oncall
            send_resolved: true
      - name: deadman
        webhook_configs:
          - url: http://alert-sink.monitoring:8080/deadman
      - name: "null"

grafana:
  persistence: { enabled: false }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: much-ca
    hosts: [grafana.localtest.me]
    tls:
      - hosts: [grafana.localtest.me]
        secretName: grafana-tls
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }
